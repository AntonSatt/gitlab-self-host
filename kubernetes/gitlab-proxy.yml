apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-docker
  namespace: apps
  labels:
    kubernetes.io/service-name: gitlab-docker
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - 10.0.0.10
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-docker
  namespace: apps
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.example.com
      secretName: gitlab-tls
  rules:
    - host: git.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab-docker
                port:
                  number: 80
