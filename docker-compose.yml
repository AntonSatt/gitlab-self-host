services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:?Set GITLAB_VERSION in .env}
    container_name: gitlab
    hostname: ${GITLAB_DOMAIN:?Set GITLAB_DOMAIN in .env}
    restart: always
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_DOMAIN}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}

        # TLS terminates at Traefik or Nginx.
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        letsencrypt['enable'] = false
        nginx['proxy_set_headers'] = {
          "Host" => "$$http_host_with_default",
          "X-Real-IP" => "$$remote_addr",
          "X-Forwarded-For" => "$$proxy_add_x_forwarded_for",
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }

        # Low-resource profile used by the reference deployment.
        puma['worker_processes'] = 0
        puma['worker_timeout'] = 120
        sidekiq['concurrency'] = 5

        # Disable bundled metrics services when external monitoring is used.
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false

        # Enable later only if the container registry is required.
        registry['enable'] = false
        gitlab_rails['registry_enabled'] = false

        postgresql['shared_buffers'] = "256MB"
        postgresql['max_worker_processes'] = 2

        gitaly['configuration'] = {
          concurrency: [
            { rpc: "/gitaly.SmartHTTPService/PostReceivePack", max_per_repo: 3 },
            { rpc: "/gitaly.SSHService/SSHUploadPack", max_per_repo: 3 },
          ],
        }
    ports:
      - "${GITLAB_HTTP_BIND:-127.0.0.1}:${GITLAB_HTTP_PORT:-8080}:80"
      - "${GITLAB_SSH_BIND:-0.0.0.0}:${GITLAB_SSH_PORT:-2222}:22"
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
